##
# ==============================================================================
# neolamia_com.conf - Nginx Site Configuration (neolamia.com / server suite)
# ==============================================================================
# Purpose & Architecture Explanation:
# 1. This site configuration is deployed to /etc/nginx/sites-available/neolamia_com.conf
#    and activated via symlink in /etc/nginx/sites-enabled/neolamia_com.conf.
# 2. To avoid Nginx 'conflicting server name' warnings on port 80 and port 443:
#    - The original /etc/nginx/sites-available/default is kept completely untouched.
#    - The default active symlink (/etc/nginx/sites-enabled/default) is unlinked.
#    - All virtual hosting for this suite runs cleanly through neolamia_com.conf.
# 3. 'server_name' includes '_' as a generic catch-all fallback so requests
#    without a specific Host header resolve properly to this server block.
# 4. Serves document root from /tmp/html with FastCGI PHP processing, crontab
#    reboot persistence, and strict rules blocking direct access to hidden
#    files and SQLite databases (.sqlite, .db, .sql, .conf, .log).
# ==============================================================================
##

server {
	listen 80 default_server;
	listen [::]:80 default_server;

	server_name _;
	access_log /tmp/log/nginx/default.log;
	etag on;
	add_header Cache-Control "no-cache";

	root /tmp/html;
	index index.php index.html;

	location / {
		try_files $uri $uri/ =404;
	}

	location ~ \.php$ {
		etag on;
		add_header 'Cache-Control' 'no-cache' always;
		include snippets/fastcgi-php.conf;
		fastcgi_pass unix:/run/php/php8.5-fpm.sock;
	}

	# Protect sensitive files and hidden files
	location ~ /\. {
		deny all;
	}

	location ~* \.(sqlite|sql|db|conf|log)$ {
		deny all;
	}
}
